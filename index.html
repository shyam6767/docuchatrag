<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuChat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

      <div class="left-panel">
        <h2>Document</h2>
        <textarea id="doc-input" placeholder="Paste your document here..."></textarea>
        <label for="pdf-upload" id="upload-label">Upload PDF</label>
        <input type="file" id="pdf-upload" accept=".pdf" />
        <button id="load-btn">Load Document</button>
        <p id="doc-status"></p>
      </div>

      <div class="right-panel">
        <h2>Ask Questions</h2>
        <div id="chat-box"></div>
        <div class="input-row">
          <input type="text" id="question-input" placeholder="Ask something about your document..." />
          <button id="ask-btn">Ask</button>
        </div>
      </div>

    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
